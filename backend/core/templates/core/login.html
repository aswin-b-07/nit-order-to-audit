{% extends "core/base.html" %}

{% block title %}Login - Order-to-Audit{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="card login-card">
        <h2 style="margin-top: 0; margin-bottom: 1.25rem; text-align: center;">Login</h2>
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert alert-error">Invalid username or password.</div>
            {% endif %}
            <div class="form-group">
                <label for="id_username">Username:</label>
                <input type="text" name="username" id="id_username" class="form-control" autofocus required>
            </div>
            <div class="form-group">
                <label for="id_password">Password:</label>
                <input type="password" name="password" id="id_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Log In</button>
        </form>
    </div>
</div>
{% endblock %}
